[extend]
useDefault = true

[allowlist]
description = "Dependency installations, disposable local clusters, and hash manifests are not repository source secrets"
paths = [
  '''(?i)(^|[\\/])node_modules([\\/]|$)''',
  '''(?i)(^|[\\/])work([\\/]|$)''',
  '''(?i)(^|[\\/])test-results([\\/]|$)''',
  '''(?i)HANDOFF_MANIFEST_SHA256\.json''',
  '''(?i).*\.sha256$'''
]
