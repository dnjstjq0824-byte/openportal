# OpenPortal Production-Grade Multi-Node High-Availability Cluster (Phase 9)
# All services configured with health checks, replica redundancy, and secure networking.
services:
  # -------------------------------------------------------------
  # 1. OpenSearch Multi-Node Clustered Storage & Inverted Indexes
  # -------------------------------------------------------------
  opensearch-node1:
    image: opensearchproject/opensearch:2.19.0
    container_name: openportal-os-node1
    environment:
      - cluster.name=openportal-cluster
      - node.name=os-node1
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=os-node1,os-node2
      - node.roles=cluster_manager,data,ingest
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
      memlock: { soft: -1, hard: -1 }
    volumes:
      - osdata1:/usr/share/opensearch/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s'"]
      interval: 5s
      timeout: 5s
      retries: 30

  opensearch-node2:
    image: opensearchproject/opensearch:2.19.0
    container_name: openportal-os-node2
    environment:
      - cluster.name=openportal-cluster
      - node.name=os-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=os-node1,os-node2
      - node.roles=cluster_manager,data,ingest
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
      memlock: { soft: -1, hard: -1 }
    volumes:
      - osdata2:/usr/share/opensearch/data
    networks:
      - internal-net
    depends_on:
      - opensearch-node1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=green&timeout=3s'"]
      interval: 5s
      timeout: 5s
      retries: 30

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.0
    container_name: openportal-os-dashboards
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch-node1:9200","http://opensearch-node2:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    networks:
      - internal-net
    depends_on:
      opensearch-node1: { condition: service_healthy }

  # -------------------------------------------------------------
  # 2. PostgreSQL Primary + Read-Replica HA Cluster
  # -------------------------------------------------------------
  postgres-primary:
    image: postgres:17.10
    container_name: openportal-pg-primary
    environment:
      POSTGRES_USER: openportal
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_password_change_me}
      POSTGRES_DB: openportal
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c shared_buffers=512MB
      -c max_connections=200
    volumes:
      - pgdata_primary:/var/lib/postgresql/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openportal -d openportal"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-replica:
    image: postgres:17.10
    container_name: openportal-pg-replica
    environment:
      PGUSER: openportal
      PGPASSWORD: ${DB_PASSWORD:-local_dev_password_change_me}
    command: >
      bash -c "
      until pg_isready -h postgres-primary -p 5432 -U openportal; do sleep 1; done;
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U openportal -vP -R -X stream;
      fi;
      exec postgres -c hot_standby=on
      "
    volumes:
      - pgdata_replica:/var/lib/postgresql/data
    networks:
      - internal-net
    depends_on:
      postgres-primary: { condition: service_healthy }

  # -------------------------------------------------------------
  # 3. Redis Distributed Caching & Rate-Limiting Store
  # -------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: openportal-redis
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------
  # 4. Clustered Stateless Go Search API Gateways
  # -------------------------------------------------------------
  api-gateway-1:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: openportal-api-gw1
    environment:
      PORT: "8080"
      LISTEN_HOST: "0.0.0.0"
      OPENSEARCH_URL: "http://opensearch-node1:9200"
      DATABASE_URL: "postgres://openportal:${DB_PASSWORD:-local_dev_password_change_me}@postgres-primary:5432/openportal"
      DATABASE_READ_URL: "postgres://openportal:${DB_PASSWORD:-local_dev_password_change_me}@postgres-replica:5432/openportal"
      REDIS_URL: "redis://redis:6379"
      ENABLE_DEMO_VERTICALS: "true"
    networks:
      - internal-net
    depends_on:
      opensearch-node1: { condition: service_healthy }
      postgres-primary: { condition: service_healthy }
      redis: { condition: service_healthy }

  api-gateway-2:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: openportal-api-gw2
    environment:
      PORT: "8080"
      LISTEN_HOST: "0.0.0.0"
      OPENSEARCH_URL: "http://opensearch-node2:9200"
      DATABASE_URL: "postgres://openportal:${DB_PASSWORD:-local_dev_password_change_me}@postgres-primary:5432/openportal"
      DATABASE_READ_URL: "postgres://openportal:${DB_PASSWORD:-local_dev_password_change_me}@postgres-replica:5432/openportal"
      REDIS_URL: "redis://redis:6379"
      ENABLE_DEMO_VERTICALS: "true"
    networks:
      - internal-net
    depends_on:
      opensearch-node2: { condition: service_healthy }
      postgres-primary: { condition: service_healthy }
      redis: { condition: service_healthy }

  # -------------------------------------------------------------
  # 5. Reverse Proxy & Round-Robin Load Balancer
  # -------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: openportal-proxy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.cluster.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal-net
    depends_on:
      - api-gateway-1
      - api-gateway-2

  # -------------------------------------------------------------
  # 6. Observability Stack: Prometheus & Grafana
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: openportal-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks:
      - internal-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: openportal-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_openportal_telemetry
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
    networks:
      - internal-net
    depends_on:
      - prometheus

networks:
  internal-net:
    driver: bridge

volumes:
  osdata1: {}
  osdata2: {}
  pgdata_primary: {}
  pgdata_replica: {}
  redisdata: {}
  promdata: {}
  grafanadata: {}

