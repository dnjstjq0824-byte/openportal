upstream api_cluster {
    least_conn;
    server api-gateway-1:8080 max_fails=3 fail_timeout=10s;
    server api-gateway-2:8080 max_fails=3 fail_timeout=10s;
}

limit_req_zone $binary_remote_addr zone=search_rate_limit:10m rate=100r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 16M;

    # Security Headers (Phase 8 Production Hardening)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    location /healthz {
        proxy_pass http://api_cluster;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://api_cluster;
        proxy_set_header Host $host;
    }

    location /api/ {
        limit_req zone=search_rate_limit burst=50 nodelay;

        proxy_pass http://api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location / {
        return 404 "Not Found";
    }
}

