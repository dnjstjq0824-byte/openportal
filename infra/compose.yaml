# LOCAL DEVELOPMENT ONLY; all published ports bind loopback.
services:
  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_USER: openportal
      POSTGRES_PASSWORD: local_dev_password_change_me
      POSTGRES_DB: openportal
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openportal -d openportal"]
      interval: 3s
      retries: 30
  opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["osdata:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s'"]
      interval: 5s
      retries: 60
    ulimits:
      nofile: {soft: 65536, hard: 65536}
  migrate:
    image: node:24.19.0-bookworm-slim
    working_dir: /workspace
    volumes: ["..:/workspace", "migration_modules:/workspace/node_modules"]
    environment:
      DATABASE_URL: postgres://openportal:local_dev_password_change_me@postgres:5432/openportal
    command: ["sh","-c","npm ci --omit=dev --ignore-scripts && node scripts/migrate.mjs"]
    depends_on:
      postgres: {condition: service_healthy}
  seed:
    image: python:3.12.14-slim
    working_dir: /workspace
    volumes: ["..:/workspace:ro"]
    environment: {OPENSEARCH_URL: "http://opensearch:9200"}
    command: ["python","scripts/seed.py"]
    depends_on:
      opensearch: {condition: service_healthy}
  api:
    profiles: ["app"]
    build: ../backend
    environment: {OPENSEARCH_URL: "http://opensearch:9200", LISTEN_HOST: "0.0.0.0"}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      seed: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
  gateway:
    profiles: ["app"]
    image: node:24.19.0-bookworm-slim
    working_dir: /workspace
    volumes: ["..:/workspace", "gateway_modules:/workspace/node_modules"]
    environment:
      DATABASE_URL: postgres://openportal:local_dev_password_change_me@postgres:5432/openportal
      SEARCH_BACKEND_URL: http://api:8080
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8090
      PUBLIC_ORIGIN: http://127.0.0.1:5173
    command: ["sh","-c","npm ci --omit=dev --ignore-scripts && node gateway/server.mjs"]
    ports: ["127.0.0.1:8090:8090"]
    depends_on:
      postgres: {condition: service_healthy}
      api: {condition: service_started}
  crawler:
    profiles: ["crawler"]
    build: ../backend
    entrypoint: ["/crawler"]
    command: ["--opensearch=http://opensearch:9200", "--index=documents_v2"]
    environment:
      OPENSEARCH_URL: "http://opensearch:9200"
      DATABASE_URL: postgres://openportal:local_dev_password_change_me@postgres:5432/openportal
    depends_on:
      opensearch: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  web:
    profiles: ["app"]
    image: node:24.19.0-bookworm-slim
    working_dir: /workspace
    volumes: ["../apps/web:/workspace", "web_modules:/workspace/node_modules"]
    environment:
      API_PROXY_TARGET: "http://api:8080"
      GATEWAY_PROXY_TARGET: "http://gateway:8090"
    command: ["sh","-c","npm ci && npm run dev -- --host 0.0.0.0"]
    ports: ["127.0.0.1:5173:5173"]
    depends_on: [api, gateway]
volumes:
  pgdata: {}
  osdata: {}
  migration_modules: {}
  gateway_modules: {}
  web_modules: {}
