syntax = "proto3";
package openportal.portal.v1;

option go_package = "github.com/dnjstjq0824-byte/openportal/backend/gen/openportal/portal/v1;portalv1";
service PortalService {
  rpc GetModules(GetModulesRequest) returns (GetModulesResponse);
}
message GetModulesRequest {
  string locale = 1;
  string surface = 2;
}
message Module {
  string key = 1;
  string title = 2;
  string json_payload = 3;
}
message GetModulesResponse {
  repeated Module modules = 1;
}
